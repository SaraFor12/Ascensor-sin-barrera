<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso a Paso - Ascensor Sin Barreras | Solicitud de Acceso</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              sage: '#5B8C5A',
              sageHover: '#4A7549',
              sageLight: '#8FB98E',
              sageBg: '#EAF3EC',
              pastelBlue: '#E8F1F5',
              cardBlue: '#D2E3EB',
              slateDark: '#1E2D3D',
              slateMedium: '#34495E',
              accentOrange: '#E07A5F'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-['Montserrat'] min-h-screen flex flex-col justify-between">

  <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
    <!-- Encabezado -->
    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-extrabold text-brand-slateDark mb-2">Ascensor sin barrera</h1>
      <p class="text-gray-600 font-medium">Solicitud de Acceso y Registro de Usuario</p>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-xl border border-gray-100">
      <form id="elevatorForm" action="https://formspree.io/f/xyezwjbw" method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <!-- Campos Ocultos para Fecha y Firma -->
        <input type="hidden" name="fecha_envio" id="fechaEnvio">
        <input type="hidden" name="firma" id="firmaInput">

        <!-- Datos Personales -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo *</label>
            <input type="text" name="nombre_completo" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-sage focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico *</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-sage focus:outline-none transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Teléfono / Celular</label>
            <input type="tel" name="telefono" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-sage focus:outline-none transition">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Dependencia / Ubicación</label>
            <input type="text" name="ubicacion" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-sage focus:outline-none transition">
          </div>
        </div>

        <!-- Archivo Adjunto -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Adjuntar Archivo o Documento</label>
          <input type="file" name="archivo_adjunto" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-brand-sageBg file:text-brand-sageHover hover:file:bg-brand-sageLight/20 cursor-pointer">
        </div>

        <!-- Observaciones -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Observaciones o Motivo de la Solicitud</label>
          <textarea name="observaciones" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-sage focus:outline-none transition"></textarea>
        </div>

        <!-- Firma Canvas -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Firma Digital *</label>
          <div class="border border-gray-300 rounded-lg p-2 bg-gray-50 flex flex-col items-center">
            <canvas id="signaturePad" width="350" height="150" class="border border-dashed border-gray-400 bg-white rounded cursor-crosshair touch-none"></canvas>
            <button type="button" id="clearSignature" class="mt-2 text-xs text-red-600 underline font-semibold">Limpiar firma</button>
          </div>
        </div>

        <!-- Botón de Envío -->
        <div class="text-center pt-4">
          <button type="submit" class="w-full md:w-auto px-8 py-3.5 bg-brand-sage text-white font-bold rounded-lg hover:bg-brand-sageHover transition shadow-lg">
            Enviar Solicitud
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Script para la Firma y Envío -->
  <script>
    // Configuración del Canvas para la Firma
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000000';
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    document.getElementById('clearSignature').addEventListener('click', function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Capturar fecha y convertir firma antes de enviar a Formspree
    document.getElementById('elevatorForm').addEventListener('submit', function(e) {
      const ahora = new Date();
      document.getElementById('fechaEnvio').value = ahora.toLocaleString('es-CO');
      document.getElementById('firmaInput').value = canvas.toDataURL('image/png');
    });
  </script>
</body>
</html>
